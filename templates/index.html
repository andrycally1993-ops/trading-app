<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading App - BTC/USDC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #fff; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        pre { background: #0a0a0a !important; color: #0f0 !important; font-size: 12px; }
    </style>
</head>
<body class="p-3">
    <div class="container-fluid" style="max-width: 1200px;">
        <h2 class="mb-4 text-center">🤖 Bot Trading BTC-USDC</h2>

        <div class="row">
            <!-- Colonna Sinistra: Grafico e Log -->
            <div class="col-lg-8 mb-3">
                <!-- Sezione Grafico Candele -->
                <div class="card p-3 mb-3">
                    <h5 class="mb-3">Grafico BTC-USDC</h5>
                    <div id="tradingview_widget" style="height: 400px; background: #000; display: flex; align-items: center; justify-content: center; color: #666; border-radius: 4px;">
                        Visualizzazione Grafico Candele
                    </div>
                </div>

                <!-- NUOVA SEZIONE: Posizioni / Ordini Fatti -->
                <div class="card p-3 mb-3">
                    <div class="d-flex justify-content: space-between align-items-center mb-2">
                        <h5 class="mb-0">Posizioni e Ordini</h5>
                        <button class="btn btn-secondary btn-sm" onclick="loadPositions()">Aggiorna Posizioni</button>
                    </div>
                    <pre id="positions-output" class="p-3 rounded mb-0" style="max-height: 150px; overflow-y: auto;">Nessuna posizione caricata.</pre>
                </div>

                <!-- Sezione Log e Risposte API OKX -->
                <div class="card p-3">
                    <h5 class="mb-3">Log e Risposte API OKX</h5>
                    <pre id="api-log" class="p-3 rounded mb-0" style="max-height: 200px; overflow-y: auto;">Pronto.</pre>
                </div>
            </div>

            <!-- Colonna Destra: Autopilot e Operazioni Rapide -->
            <div class="col-lg-4">
                <!-- Sistema Autopilot -->
                <div class="card p-3 mb-3">
                    <h5 class="mb-3">Sistema Autopilot</h5>
                    <p class="mb-1 text-muted">Stato Autopilot</p>
                    <div id="autopilot-status" class="fw-bold mb-3 text-danger">DISATTIVATO</div>
                    <button class="btn btn-outline-light w-100 btn-sm" onclick="toggleAutopilot()">Attiva / Disattiva</button>
                </div>

                <!-- Operazioni Rapide -->
                <div class="card p-3 mb-3">
                    <h5 class="mb-3">Operazioni Rapide</h5>
                    <div class="mb-3">
                        <label for="order-size" class="form-label text-muted">Quantità:</label>
                        <input type="text" id="order-size" class="form-control bg-dark text-white border-secondary" value="0.001">
                    </div>
                    <div class="d-grid gap-2">
                        <button class="btn btn-success fw-bold py-2" onclick="executeOrder('buy')">COMPRA (Buy)</button>
                        <button class="btn btn-danger fw-bold py-2" onclick="executeOrder('sell')">VENDI (Sell)</button>
                    </div>
                </div>

                <!-- Saldo Reale -->
                <div class="card p-3">
                    <h5 class="mb-3">Saldo Reale USDC</h5>
                    <h3 id="balance-display" class="text-success mb-2">Caricamento...</h3>
                    <button class="btn btn-secondary btn-sm w-100" onclick="checkBalance()">Aggiorna Saldo</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let autopilotActive = false;

        function logResponse(data) {
            document.getElementById('api-log').innerText = JSON.stringify(data, null, 2);
        }

        function checkBalance() {
            fetch('/api/balance')
                .then(res => res.json())
                .then(data => {
                    logResponse(data);
                    try {
                        let ccyBal = data.data[0].details.find(d => d.ccy === 'USDC');
                        if (ccyBal) {
                            document.getElementById('balance-display').innerText = ccyBal.availBal + " USDC";
                        } else {
                            document.getElementById('balance-display').innerText = "0 USDC";
                        }
                    } catch (e) {
                        document.getElementById('balance-display').innerText = "Errore saldo";
                    }
                })
                .catch(err => {
                    document.getElementById('api-log').innerText = "Errore di rete: " + err;
                });
        }

        function executeOrder(side) {
            let size = document.getElementById('order-size').value;
            let url = side === 'buy' ? '/api/buy' : '/api/sell';
            
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ size: size })
            })
            .then(res => res.json())
            .then(data => {
                logResponse(data);
                checkBalance();
                loadPositions();
            })
            .catch(err => {
                document.getElementById('api-log').innerText = "Errore ordine: " + err;
            });
        }

        function loadPositions() {
            fetch('/api/positions')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('positions-output').innerText = JSON.stringify(data, null, 2);
                    logResponse(data);
                })
                .catch(err => {
                    document.getElementById('positions-output').innerText = "Errore: " + err;
                });
        }

        function toggleAutopilot() {
            autopilotActive = !autopilotActive;
            let statusEl = document.getElementById('autopilot-status');
            statusEl.innerText = autopilotActive ? "ATTIVO" : "DISATTIVATO";
            statusEl.className = autopilotActive ? "fw-bold mb-3 text-success" : "fw-bold mb-3 text-danger";

            fetch('/api/autopilot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: autopilotActive })
            })
            .then(res => res.json())
            .then(data => logResponse(data))
            .catch(err => logResponse({ error: err }));
        }

        window.onload = function() {
            checkBalance();
            loadPositions();
        };
    </script>
</body>
</html>
