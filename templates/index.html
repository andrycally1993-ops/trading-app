<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading App Reale - OKX</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button { background-color: #00b0ff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #0091ea; }
        pre { background: #2d2d2d; padding: 15px; border-radius: 5px; text-align: left; overflow-x: auto; color: #00e676; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Pannello Trading Reale OKX</h2>
        <p>Stato Connessione Server: <strong>Online</strong></p>
        
        <button onclick="checkBalance()">VERIFICA SALDO CONTO</button>
        
        <h3>Risultato / Risposta API:</h3>
        <pre id="result">Clicca il pulsante per interrogare le API...</pre>
    </div>

    <script>
        function checkBalance() {
            document.getElementById("result").innerText = "Caricamento in corso e sincronizzazione...";
            fetch('/api/balance')
                .then(response => response.json())
                .then(data => {
                    document.getElementById("result").innerText = JSON.stringify(data, null, 4);
                })
                .catch(error => {
                    document.getElementById("result").innerText = "Errore di connessione: " + error;
                });
        }
    </script>
</body>
</html>
