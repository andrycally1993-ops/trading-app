<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading App - BTC/USDC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white p-4">
    <div class="container" style="max-width: 600px;">
        <h2 class="mb-4 text-center">🤖 Bot Trading BTC-USDC</h2>

        <!-- Sezione Saldo Reale -->
        <div class="card bg-secondary text-white mb-3 p-3">
            <h5>Saldo Conto Reale</h5>
            <h3 id="balance-display">Caricamento...</h3>
            <button class="btn btn-light btn-sm mt-2" onclick="checkBalance()">Aggiorna Saldo Reale</button>
        </div>

        <!-- Sezione Comandi Rapidi (Compra / Vendi) -->
        <div class="card bg-secondary text-white mb-3 p-3">
            <h5>Azioni Rapide (Market)</h5>
            <div class="mb-2">
                <label for="order-size" class="form-label">Quantità (sz):</label>
                <input type="text" id="order-size" class="form-control" value="0.001">
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-success w-50" onclick="executeOrder('buy')">COMPRA (Buy)</button>
                <button class="btn btn-danger w-50" onclick="executeOrder('sell')">VENDI (Sell)</button>
            </div>
        </div>

        <!-- NUOVA SEZIONE: Posizioni Aperte (Integrata e Pulita) -->
        <div class="card bg-secondary text-white mb-3 p-3">
            <h5>Posizioni Aperte / Asset</h5>
            <button class="btn btn-light btn-sm mb-2" onclick="loadPositions()">Aggiorna Posizioni</button>
            <pre id="positions-output" style="background:#111; color:#0f0; padding:10px; border-radius:5px; max-height:150px; overflow-y:auto; font-size: 12px; margin:0;"></pre>
        </div>

        <!-- Sezione Log e Risposte API OKX -->
        <div class="card bg-secondary text-white p-3">
            <h5>Log e Risposte API OKX</h5>
            <pre id="api-log" style="background:#111; color:#0f0; padding:10px; border-radius:5px; max-height:200px; overflow-y:auto; font-size: 12px; margin:0;">Pronto.</pre>
        </div>
    </div>

    <script>
        function logResponse(data) {
            document.getElementById('api-log').innerText = JSON.stringify(data, null, 2);
        }

        function checkBalance() {
            fetch('/api/balance')
                .then(res => res.json())
                .then(data => {
                    logResponse(data);
                    try {
                        let ccyBal = data.data[0].details.find(d => d.ccy === 'USDC');
                        if (ccyBal) {
                            document.getElementById('balance-display').innerText = ccyBal.availBal + " USDC";
                        } else {
                            document.getElementById('balance-display').innerText = "0 USDC";
                        }
                    } catch (e) {
                        document.getElementById('balance-display').innerText = "Errore lettura saldo";
                    }
                })
                .catch(err => {
                    document.getElementById('api-log').innerText = "Errore di rete: " + err;
                });
        }

        function executeOrder(side) {
            let size = document.getElementById('order-size').value;
            let url = side === 'buy' ? '/api/buy' : '/api/sell';
            
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ size: size })
            })
            .then(res => res.json())
            .then(data => {
                logResponse(data);
                checkBalance(); // Aggiorna il saldo dopo l'ordine
            })
            .catch(err => {
                document.getElementById('api-log').innerText = "Errore ordine: " + err;
            });
        }

        function loadPositions() {
            fetch('/api/positions')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('positions-output').innerText = JSON.stringify(data, null, 2);
                    logResponse(data);
                })
                .catch(err => {
                    document.getElementById('positions-output').innerText = "Errore: " + err;
                });
        }

        // Carica il saldo automaticamente all'avvio
        window.onload = function() {
            checkBalance();
        };
    </script>
</body>
</html>
