<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKX Trading Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card { background-color: #181a20; border: 1px solid #2b313a; border-radius: 6px; }
        .btn-success { background-color: #0ecb81; border: none; }
        .btn-danger { background-color: #f6465d; border: none; }
        pre { background: #0b0e11 !important; color: #0ecb81 !important; border: 1px solid #2b313a; font-size: 11px; }
        .position-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #2b313a; font-size: 12px; }
        .budget-btn { background-color: #2b313a; color: #eaecef; border: 1px solid #474d57; font-size: 11px; margin-right: 4px; }
        .budget-btn:hover { background-color: #0ecb81; color: #000; border-color: #0ecb81; }
    </style>
</head>
<body class="p-3">
    <div class="container-fluid" style="max-width: 1400px;">
        <div class="row">
            <!-- Colonna Sinistra: Grafico, Posizioni e Log -->
            <div class="col-xl-8 mb-3">
                <!-- Sezione Grafico Candele -->
                <div class="card p-3 mb-3">
                    <div class="tradingview-widget-container" style="height: 400px; width: 100%;">
                        <div id="tradingview_chart" style="height: 100%; width: 100%;"></div>
                        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                        <script type="text/javascript">
                            new TradingView.widget({
                                "width": "100%",
                                "height": "400",
                                "symbol": "OKX:BTCUSDC",
                                "interval": "15",
                                "timezone": "Europe/Rome",
                                "theme": "dark",
                                "style": "1",
                                "locale": "it",
                                "toolbar_bg": "#f1f3f6",
                                "enable_publishing": false,
                                "hide_side_toolbar": false,
                                "allow_symbol_change": true,
                                "container_id": "tradingview_chart"
                            });
                        </script>
                    </div>
                </div>

                <!-- Sezione Posizioni Aperte -->
                <div class="card p-3 mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="text-muted mb-0">Positions (Posizioni Aperte)</h6>
                        <div>
                            <button class="btn btn-outline-light btn-sm me-1" style="font-size: 11px;" onclick="loadPositions()">Aggiorna</button>
                            <button class="btn btn-danger btn-sm" style="font-size: 11px;" onclick="closeAllPositions()">Vendi Tutto</button>
                        </div>
                    </div>
                    <div id="positions-container" class="rounded" style="background:#0b0e11; border:1px solid #2b313a; min-height: 80px; max-height: 150px; overflow-y: auto;">
                        <div class="p-2 text-muted" style="font-size:12px;">Nessuna posizione aperta.</div>
                    </div>
                </div>

                <!-- Sezione Log e Risposte API OKX -->
                <div class="card p-3">
                    <h6 class="text-muted mb-2">Log e Risposte API OKX</h6>
                    <pre id="api-log" class="p-2 rounded mb-0" style="max-height: 150px; overflow-y: auto;">Pronto.</pre>
                </div>
            </div>

            <!-- Colonna Destra: Autopilot, Operazioni Rapide e Saldo Reale USDC -->
            <div class="col-xl-4">
                <!-- Sistema Autopilot -->
                <div class="card p-3 mb-3">
                    <h6 class="text-muted mb-2">Sistema Autopilot</h6>
                    <div class="mb-1 text-muted" style="font-size: 13px;">Stato Autopilot</div>
                    <div id="autopilot-status" class="fw-bold mb-3 text-danger">DISATTIVATO</div>
                    <button class="btn btn-outline-light w-100 btn-sm" onclick="toggleAutopilot()">Attiva / Disattiva</button>
                </div>

                <!-- Operazioni Rapide -->
                <div class="card p-3 mb-3">
                    <h6 class="text-muted mb-2">Operazioni Rapide (USDC)</h6>
                    <div class="mb-2">
                        <label for="order-size" class="form-label text-muted" style="font-size: 12px;">Importo da spendere (USDC):</label>
                        <input type="text" id="order-size" class="form-control bg-dark text-white border-secondary form-control-sm" value="12">
                        <div class="mt-2">
                            <span class="text-muted" style="font-size: 11px;">Scegli budget:</span>
                            <button class="btn btn-sm budget-btn" onclick="setBudget(10)">10 USDC</button>
                            <button class="btn btn-sm budget-btn" onclick="setBudget(12)">12 USDC</button>
                            <button class="btn btn-sm budget-btn" onclick="setBudget(15)">15 USDC</button>
                        </div>
                    </div>
                    <div class="d-grid gap-2 mt-2">
                        <button class="btn btn-success fw-bold py-2" onclick="executeOrder('buy')">COMPRA (Buy)</button>
                        <button class="btn btn-danger fw-bold py-2" onclick="executeOrder('sell')">VENDI (Sell)</button>
                    </div>
                </div>

                <!-- Saldo Reale USDC (Fisso nel suo posto originale in basso a destra) -->
                <div class="card p-3">
                    <h6 class="text-muted mb-2">Saldo Reale USDC</h6>
                    <h4 id="balance-display" class="text-success mb-2">Caricamento...</h4>
                    <button class="btn btn-secondary btn-sm w-100" onclick="checkBalance()">Aggiorna Saldo</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let autopilotActive = false;

        function setBudget(val) {
            document.getElementById('order-size').value = val;
        }

        function logResponse(data) {
            document.getElementById('api-log').innerText = JSON.stringify(data, null, 2);
        }

        function checkBalance() {
            fetch('/api/balance')
                .then(res => res.json())
                .then(data => {
                    logResponse(data);
                    try {
                        let ccyBal = data.data[0].details.find(d => d.ccy === 'USDC');
                        if (ccyBal) {
                            let balVal = parseFloat(ccyBal.availBal);
                            document.getElementById('balance-display').innerText = balVal.toFixed(2) + " USDC";
                        } else {
                            document.getElementById('balance-display').innerText = "0.00 USDC";
                        }
                    } catch (e) {
                        document.getElementById('balance-display').innerText = "0.00 USDC";
                    }
                })
                .catch(err => {
                    document.getElementById('api-log').innerText = "Errore di rete: " + err;
                });
        }

        function loadPositions() {
            fetch('/api/positions')
                .then(res => res.json())
                .then(data => {
                    logResponse(data);
                    let container = document.getElementById('positions-container');
                    try {
                        let details = data.data[0].details;
                        let activePositions = details.filter(d => parseFloat(d.availBal) > 0 && d.ccy !== 'USDC' && d.ccy !== 'USDT');
                        
                        if (activePositions.length > 0) {
                            let html = "";
                            activePositions.forEach(pos => {
                                html += `<div class="position-row">
                                            <div>
                                                <span class="fw-bold text-light">${pos.ccy}-USDC</span>, 
                                                <span class="text-success fw-bold">BUY</span> 
                                                <span class="text-muted">Qt: ${parseFloat(pos.availBal).toFixed(4)}</span>
                                            </div>
                                            <div>
                                                <span class="text-warning">Attiva</span>
                                            </div>
                                         </div>`;
                            });
                            container.innerHTML = html;
                        } else {
                            container.innerHTML = '<div class="p-2 text-muted" style="font-size:12px;">Nessuna posizione aperta.</div>';
                        }
                    } catch (e) {
                        container.innerHTML = '<div class="p-2 text-muted" style="font-size:12px;">Nessuna posizione aperta.</div>';
                    }
                })
                .catch(err => {
                    document.getElementById('positions-container').innerHTML = '<div class="p-2 text-danger" style="font-size:12px;">Errore caricamento posizioni.</div>';
                });
        }

        function closeAllPositions() {
            if(!confirm("Vuoi davvero vendere tutto e convertire in USDC?")) return;
            fetch('/api/close-positions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            })
            .then(res => res.json())
            .then(data => {
                logResponse(data);
                alert("Operazione di vendita completata!");
                checkBalance();
                loadPositions();
            })
            .catch(err => {
                document.getElementById('api-log').innerText = "Errore chiusura: " + err;
            });
        }

        function executeOrder(side) {
            let size = document.getElementById('order-size').value;
            let url = side === 'buy' ? '/api/buy' : '/api/sell';
            let payload = side === 'buy' ? { instId: "BTC-USDC", size: size } : { instId: "BTC-USDC" };

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                logResponse(data);
                if (data.code !== "0") {
                    alert("Errore Ordine OKX: " + (data.msg || "Verifica il saldo"));
                } else {
                    alert("Ordine eseguito con successo!");
                }
                checkBalance();
                loadPositions();
            })
            .catch(err => {
                document.getElementById('api-log').innerText = "Errore ordine: " + err;
            });
        }

        function toggleAutopilot() {
            autopilotActive = !autopilotActive;
            let statusEl = document.getElementById('autopilot-status');
            statusEl.innerText = autopilotActive ? "ATTIVO" : "DISATTIVATO";
            statusEl.className = autopilotActive ? "fw-bold mb-3 text-success" : "fw-bold mb-3 text-danger";

            fetch('/api/autopilot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: autopilotActive })
            })
            .then(res => res.json())
            .then(data => logResponse(data))
            .catch(err => logResponse({ error: err }));
        }

        window.onload = function() {
            checkBalance();
            loadPositions();
        };
    </script>
</body>
</html>
