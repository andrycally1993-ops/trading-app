<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading App - BTC/USDC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #fff; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        pre { background: #0a0a0a !important; color: #0f0 !important; font-size: 12px; }
    </style>
</head>
<body class="p-3">
    <div class="container-fluid" style="max-width: 1200px;">
        <h2 class="mb-4 text-center">🤖 Bot Trading BTC-USDC</h2>

        <div class="row">
            <!-- Colonna Sinistra: Grafico e Log -->
            <div class="col-lg-8 mb-3">
                <!-- Sezione Grafico Candele -->
                <div class="card p-3 mb-3">
                    <h5 class="mb-3">Grafico BTC-USDC</h5>
                    <div id="tradingview_widget" style="height: 400px; background: #000; display: flex; align-items: center; justify-content: center; color: #666; border-radius: 4px;">
                        Visualizzazione Grafico Candele
                    </div>
                </div>

                <!-- Sezione Log e Risposte API OKX -->
                <div class="card p-3">
                    <h5 class="mb-3">Log e Risposte API OKX</h5>
                    <pre id="api-log" class="p-3 rounded mb-0" style="max-height: 200px; overflow-y: auto;">Pronto.</pre>
                </div>
            </div>

            <!-- Colonna Destra: Autopilot e Operazioni Rapide -->
            <div class="col-lg-4">
                <!-- Sistema Autopilot -->
                <div class="card p-3 mb-3">
                    <h5 class="mb-3">Sistema Autopilot</h5>
                    <p class="mb-1 text-muted">Stato Autopilot</p>
                    <div id="autopilot-status" class="fw-bold mb-3 text-danger">DISATTIVATO</div>
                    <button class="btn btn-outline-light w-100 btn-sm" onclick="toggleAutopilot()">Attiva / Disattiva</button>
                </div>

                <!-- Operazioni Rapide -->
                <div class="card p-3 mb-3">
                    <h5 class="mb-3">Operazioni Rapide</h5>
                    <div class="mb-3">
                        <label for="order-size" class="form-label text-muted">Quantità
