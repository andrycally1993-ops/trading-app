<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading App Reale - OKX</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        select, button {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 8px;
            font-size: 14px;
        }
        .balance-row {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
        }
        .balance-box {
            font-size: 16px;
            font-weight: bold;
        }
        .balance-display {
            color: #4cd137;
        }
        .equity-display {
            color: #fff;
        }
        .btn-action {
            width: 100%;
            background-color: #0098ea;
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
        }
        .chart-box {
            background-color: #161616;
            border-radius: 8px;
            padding: 10px;
            height: 190px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .candles-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 140px;
            padding-top: 10px;
            border-bottom: 1px solid #333;
        }
        .candle {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 12px;
        }
        .wick {
            width: 2px;
            background-color: #888;
            position: absolute;
        }
        .body-candle {
            width: 10px;
            border-radius: 2px;
            z-index: 2;
        }
        .green { background-color: #00b894; }
        .red { background-color: #d63031; }

        .trade-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-buy {
            flex: 1;
            background-color: #00b894;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-sell {
            flex: 1;
            background-color: #d63031;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .size-selector {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
        }
        .size-btn {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .size-btn.active {
            border-color: #0098ea;
            background-color: #004466;
        }
        .positions-section {
            font-size: 13px;
            color: #aaa;
            margin-top: 8px;
        }
    </style>
</head>

                <div class="balance-box equity-display">Caricamento...</div>
